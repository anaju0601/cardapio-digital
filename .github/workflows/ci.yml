name: CI - Integração Contínua

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME: cardapio_test
  JWT_SECRET: test-secret-key
  NODE_ENV: test

jobs:
  backend:
    name: Backend - TypeScript & TypeORM
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardapio_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Lint backend
        working-directory: backend
        run: npm run lint || true

      - name: Build Docker image
        run: docker build -t cardapio-api:latest -f backend/Dockerfile backend/

  frontend:
    name: Frontend - Next.js
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Lint frontend
        run: npm run lint || true

      - name: Build Docker image
        run: docker build -t cardapio-frontend:latest -f Dockerfile.frontend .

  docker-compose:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Test Docker Compose build
        run: docker-compose -f docker-compose.dev.yml build

      - name: Verify services start
        run: |
          docker-compose -f docker-compose.dev.yml up -d
          sleep 5
          docker-compose -f docker-compose.dev.yml ps
          docker-compose -f docker-compose.dev.yml down
