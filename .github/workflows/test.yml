name: Testes Automatizados

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration-tests:
    name: Testes de Integração
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardapio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar dependências do backend
        working-directory: ./backend
        run: pnpm install

      - name: Executar testes do backend
        working-directory: ./backend
        run: pnpm run test || echo "Nenhum teste configurado"
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: cardapio_test
          JWT_SECRET: test-secret

      - name: Instalar dependências do frontend
        working-directory: ./frontend
        run: pnpm install

      - name: Executar testes do frontend
        working-directory: ./frontend
        run: pnpm run test || echo "Nenhum teste configurado"

  e2e-tests:
    name: Testes End-to-End
    runs-on: ubuntu-latest
    needs: integration-tests 

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Subir containers da aplicação
        run: |
          docker compose -f docker-compose.yml up -d --build
          echo "Aguardando serviços subirem..."
          sleep 25

      - name: Verificar saúde dos serviços
        run: |
          echo "Testando backend..."
          curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3001/health || echo "Sem rota /health configurada"
          echo "Testando frontend..."
          curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3000 || echo "Frontend não respondeu"

      - name: Executar testes E2E (placeholder)
        run: echo "Aqui rodariam os testes E2E com Cypress, Playwright ou outro framework"

      - name: Encerrar containers
        if: always()
        run: docker compose down
