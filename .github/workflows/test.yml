name: Testes Automatizados

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration-tests:
    name: Testes de Integração
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardapio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar PNPM (para projetos que usam)
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Instalar dependências do backend
        working-directory: ./backend
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "📦 Usando pnpm no backend"
            pnpm install
          else
            echo "📦 Usando npm no backend"
            npm ci
          fi

      - name: Executar testes do backend
        working-directory: ./backend
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run test || echo "⚠️ Nenhum teste configurado"
          else
            npm test || echo "⚠️ Nenhum teste configurado"
          fi
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: cardapio_test
          JWT_SECRET: test-secret

      - name: Instalar dependências do frontend
        working-directory: ./frontend
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "📦 Usando pnpm no frontend"
            pnpm install
          else
            echo "📦 Usando npm no frontend"
            npm ci
          fi

      - name: Executar testes do frontend
        working-directory: ./frontend
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run test || echo "⚠️ Nenhum teste configurado"
          else
            npm test || echo "⚠️ Nenhum teste configurado"
          fi

  e2e-tests:
    name: Testes E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Iniciar aplicação com Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d --build
          echo "⏳ Aguardando serviços subirem..."
          sleep 25

      - name: Verificar saúde dos serviços
        run: |
          echo "🔍 Verificando backend..."
          curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3001/health || echo "Sem rota /health configurada"
          echo "🔍 Verificando frontend..."
          curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3000 || echo "Frontend não respondeu"

      - name: Executar testes E2E
        run: echo "🧪 Testes E2E rodariam aqui (Cypress, Playwright, etc.)"

      - name: Parar containers
        if: always()
        run: docker-compose down
