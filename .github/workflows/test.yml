name: Tests - Testes Automatizados

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME: cardapio_test
  JWT_SECRET: test-secret-key
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NODE_ENV: test

jobs:
  e2e:
    name: E2E Tests - Cypress
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardapio_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build frontend
        run: npm run build

      - name: Install Cypress dependencies
        working-directory: integration-test
        run: npm ci

      - name: Run E2E tests
        working-directory: integration-test
        run: npm exec cypress run || true

      - name: Upload Cypress reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-reports
          path: integration-test/cypress/videos
          retention-days: 7

  health-check:
    name: Service Health Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardapio_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Check PostgreSQL connection
        run: |
          apt-get update -qq
          apt-get install -y postgresql-client
          PGPASSWORD=${{ env.DB_PASSWORD }} psql -h ${{ env.DB_HOST }} -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -c "SELECT 1" || exit 1
          echo "✅ PostgreSQL is healthy"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build integrity
        run: |
          npm run build
          [ -d ".next" ] && echo "✅ Next.js build successful" || exit 1

      - name: Verify backend build
        working-directory: backend
        run: |
          npm ci
          npm run build
          [ -d "dist" ] && echo "✅ Backend build successful" || exit 1
