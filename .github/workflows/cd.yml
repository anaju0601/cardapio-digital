name: CD - Entrega Contínua

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy para Produção
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: cardapio-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: cardapio-frontend:latest

      - name: Deploy via SSH para servidor
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            docker pull cardapio-backend:latest || true
            docker pull cardapio-frontend:latest || true
            docker stop cardapio-backend || true
            docker stop cardapio-frontend || true
            docker rm cardapio-backend || true
            docker rm cardapio-frontend || true
            docker run -d --name cardapio-backend cardapio-backend:latest
            docker run -d --name cardapio-frontend -p 3000:3000 cardapio-frontend:latest
