name: CD - Deploy Produção

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy para Produção
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: production
      url: https://seu-app.com

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar secrets necessários
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "❌ DOCKER_USERNAME ou DOCKER_PASSWORD não configurados"
            echo "Configure os secrets no GitHub: Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extrair metadados
        id: meta
        run: |
          echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build e Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cardapio-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/cardapio-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.date }}
            VCS_REF=${{ github.sha }}

      - name: Build e Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cardapio-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/cardapio-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.date }}
            VCS_REF=${{ github.sha }}

      - name: Deploy para servidor
        run: |
          echo "✅ Deploy realizado com sucesso!"
          echo "📦 Backend: ${{ secrets.DOCKER_USERNAME }}/cardapio-backend:${{ steps.meta.outputs.version }}"
          echo "📦 Frontend: ${{ secrets.DOCKER_USERNAME }}/cardapio-frontend:${{ steps.meta.outputs.version }}"
          echo ""
          echo "🚀 Para deploy em servidor remoto, adicione aqui:"
          echo "   - SSH para o servidor"
          echo "   - Pull das novas imagens"
          echo "   - Restart dos containers"

      - name: Criar release tag
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v${{ steps.meta.outputs.version }}" -m "Release ${{ steps.meta.outputs.version }}"
          git push origin "v${{ steps.meta.outputs.version }}" || echo "Tag já existe"
