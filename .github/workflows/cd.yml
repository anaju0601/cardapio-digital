name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Configura ambiente Docker moderno (necessário para docker compose v2)
      - name: Setup Docker QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login seguro no Docker Hub usando secrets
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build e push das imagens de backend e frontend
      - name: Build e Push das Imagens Docker
        run: |
          echo "🏗️ Iniciando build e push das imagens Docker..."

          # Define escopos para as imagens
          BACKEND_IMAGE=raffolas/cardapio-backend
          FRONTEND_IMAGE=raffolas/cardapio-frontend

          # Gera tag única (vamos usar a versão curta do commit)
          TAG=$(echo ${{ github.sha }} | head -c7)

          echo "🧩 Backend: $BACKEND_IMAGE:$TAG"
          echo "🧩 Frontend: $FRONTEND_IMAGE:$TAG"

          # Build do Backend (Este está correto)
          docker build -t $BACKEND_IMAGE:$TAG -t $BACKEND_IMAGE:latest ./backend
          
          # --- CORREÇÃO DO BUILD DO FRONTEND ---
          # O contexto é a raiz (.) e o arquivo é -f Dockerfile.frontend
          docker build -t $FRONTEND_IMAGE:$TAG -t $FRONTEND_IMAGE:latest . -f Dockerfile.frontend
          # --------------------------------------

          # Push das imagens para o Docker Hub
          docker push $BACKEND_IMAGE:$TAG
          docker push $BACKEND_IMAGE:latest
          docker push $FRONTEND_IMAGE:$TAG
          docker push $FRONTEND_IMAGE:latest

          echo "🚀 Imagens enviadas com sucesso para o Docker Hub!"
        env:
          DOCKER_BUILDKIT: 1

      - name: Deploy finalizado
        run: echo "✅ Pipeline CD concluído com sucesso!"
