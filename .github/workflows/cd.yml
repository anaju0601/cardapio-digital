name: CD - Entrega Contínua

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy para Produção
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || 'usuario_placeholder' }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD || 'senha_placeholder' }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build e Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/cardapio-backend:latest
            ${{ env.DOCKER_USERNAME }}/cardapio-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/cardapio-frontend:latest
            ${{ env.DOCKER_USERNAME }}/cardapio-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy para servidor (exemplo)
        run: |
          echo "Deploy realizado com sucesso!"
          echo "Backend image: ${{ env.DOCKER_USERNAME }}/cardapio-backend:${{ github.sha }}"
          echo "Frontend image: ${{ env.DOCKER_USERNAME }}/cardapio-frontend:${{ github.sha }}"