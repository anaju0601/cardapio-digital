name: CD - Deploy Produção

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy para Produção
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: production

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: cardapio-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: cardapio-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy via SSH para servidor
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Para e remove containers antigos
            docker stop cardapio-backend || true
            docker stop cardapio-frontend || true
            docker rm cardapio-backend || true
            docker rm cardapio-frontend || true

            # Roda novos containers
            docker run -d --name cardapio-backend cardapio-backend:latest --restart unless-stopped
            docker run -d --name cardapio-frontend -p 3000:3000 cardapio-frontend:latest --restart unless-stopped

      - name: Notificar deploy
        run: |
          echo "✅ Deploy realizado com sucesso!"
          echo "📦 Backend: cardapio-backend:latest"
          echo "📦 Frontend: cardapio-frontend:latest"
