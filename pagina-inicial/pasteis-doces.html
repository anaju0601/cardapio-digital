<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pastéis Doces - Pastelaria Sabor Brasil</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero text-center py-5">
    <h1 class="display-4">Pastéis Doces</h1>
    <p class="lead">Delícias para adoçar seu dia!</p>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center gy-5">
      <div class="col-md-4">
        <section class="item">
          <img src="chocolate.jpg" alt="Pastel de Chocolate" class="img-fluid rounded">
          <h2>Pastel de Chocolate</h2>
          <p>Recheado com chocolate cremoso.</p>
        </section>
      </div>

      <div class="col-md-4">
        <section class="item">
          <img src="morango.png" alt="Pastel de Morango" class="img-fluid rounded">
          <h2>Pastel de Morango</h2>
          <p>Chocolate ao leite com morango.</p>
        </section>
      </div>

      <div class="col-md-4">
        <section class="item">
          <img src="leite.jpg" alt="Pastel de Doce de Leite" class="img-fluid rounded">
          <h2>Pastel de Doce de Leite</h2>
          <p>Recheado com doce de leite cremoso.</p>
        </section>
      </div>
    </div>
  </main>

  <footer class="text-white text-center py-4">
    &copy; 2025 Pastelaria Sabor Brasil. Todos os direitos reservados.
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
