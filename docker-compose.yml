version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cardapio-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cardapio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cardapio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # --- ADICIONE ISTO ---
    # O nome da imagem no Docker Hub
    image: anaju0601/manuseamento-sistema-universidade-backend 
    # --------------------
    container_name: cardapio-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cardapio_db
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cardapio-network
    restart: unless-stopped

  frontend:
    build:
      # --- CORRIJA ISTO ---
      context: . # A pasta raiz
      dockerfile: Dockerfile.frontend # O arquivo do frontend
      # --------------------
    # --- ADICIONE ISTO ---
    # O nome da imagem no Docker Hub
    image: anaju0601/manuseamento-sistema-universidade-frontend
    # --------------------
    container_name: cardapio-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - cardapio-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  cardapio-network:
    driver: bridge