version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cardapio-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cardapio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - cardapio-network-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development # Mira no estágio de 'desenvolvimento'
    container_name: cardapio-backend-dev
    ports:
      - "3001:3001"
    environment:
      CI: "true" # Impede o pnpm de fazer perguntas
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cardapio_db
      JWT_SECRET: dev-secret-key
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - cardapio-network-dev
    # --- CORREÇÃO AQUI ---
    # Instala E roda (corrige problema de 'volumes')
    command: sh -c "pnpm install && pnpm run dev"

  frontend:
    build:
      context: . 
      dockerfile: Dockerfile.frontend 
      target: deps # Mira no estágio de 'dependências'
    container_name: cardapio-frontend-dev
    environment:
      CI: "true" # Impede o pnpm de fazer perguntas
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - .:/app 
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - cardapio-network-dev
    # --- CORREÇÃO AQUI ---
    # Instala E roda (corrige problema de 'volumes')
    command: sh -c "pnpm install && pnpm run dev"

volumes:
  postgres_data_dev:

networks:
  cardapio-network-dev:
    driver: bridge