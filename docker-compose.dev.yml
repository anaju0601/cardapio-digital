# Você pode apagar esta linha 'version' se quiser, como o aviso sugere
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cardapio-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cardapio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - cardapio-network-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardapio-backend-dev
    ports:
      - "3001:3001" # <-- ESTA É A LINHA QUE FALTAVA
    environment:
      NODE_ENV: development
      DB_HOST: postgres # Conecta ao serviço 'postgres' acima
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cardapio_db
      JWT_SECRET: dev-secret-key
    volumes:
      - ./backend:/app # Espelha seu código do backend
      - /app/node_modules # Não espelha node_modules
    depends_on:
      - postgres
    networks:
      - cardapio-network-dev
    command: pnpm run dev

  frontend:
    build:
      context: . # Usa a pasta raiz
      dockerfile: Dockerfile.frontend # Usa o arquivo do frontend
    container_name: cardapio-frontend-dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - .:/app # Espelha seu código da raiz
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - cardapio-network-dev
    command: pnpm run dev

volumes:
  postgres_data_dev:

networks:
  cardapio-network-dev:
    driver: bridge
